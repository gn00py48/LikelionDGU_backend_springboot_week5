# Django의 settings.py에 해당하는 자리.
spring:
  application:
    name: springsession

  datasource:
    url: jdbc:mysql://localhost:3306/likelion_blog
    username: likelion
    password: ${DB_PASSWORD} # 환경변수로 설정 (3주차)

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update # update로 변경 (3주차)
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 1800000
  refresh-token-validity: 1209600000
